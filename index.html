<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>套皮即時預覽</title>
<style>
:root { --bg: #15181a; --panel: #1f2326; --line: #33393d; --fg: #e8ecee; --muted: #9aa5ab; --accent: #f29a2e; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; height: 100vh; height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto;
       grid-template-areas: "head" "panes" "bar" "board"; overflow: hidden; background: var(--bg); color: var(--fg); font: 13.5px/1.45 "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; }
header { grid-area: head; display: flex; align-items: center; gap: 14px; padding: 6px 16px; min-width: 0; }
header h1 { font-size: 17px; margin: 0; font-weight: 700; }
header .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.brand { flex: none; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; line-height: 1.35; text-align: right; white-space: nowrap; }
.brand img { height: 42px; display: block; }
.panes { grid-area: panes; min-height: 0; container-type: size; display: flex; justify-content: center; align-items: center; gap: 10px; padding: 0 16px; }
.pane { position: relative; flex: none; width: min(100cqw, calc(100cqh * 16 / 9)); aspect-ratio: 16 / 9; background: #000; overflow: hidden; border-radius: 4px; }
.pane canvas { width: 100%; height: 100%; display: block; }
#route { flex: 1; min-width: 120px; height: 30px; display: block; cursor: pointer; touch-action: none; }
.tag { position: absolute; left: 10px; top: 8px; padding: 2px 8px; background: rgba(0,0,0,.55); border-radius: 3px; font-size: 12.5px; pointer-events: none; }
.hud { position: absolute; left: 10px; bottom: 8px; padding: 3px 10px; background: rgba(0,0,0,.55); border-radius: 3px; font-size: 15px; font-variant-numeric: tabular-nums; pointer-events: none; }
.note { position: absolute; right: 10px; bottom: 8px; padding: 2px 8px; background: rgba(0,0,0,.55); border-radius: 3px; font-size: 11.5px; color: #cfd6da; pointer-events: none; }
.viewhint { position: absolute; right: 10px; top: 8px; padding: 2px 8px; background: rgba(0,0,0,.55); border-radius: 3px; font-size: 11.5px; color: #cfd6da; pointer-events: none; }
/* 警示：全寬紅色帶＋上下黃黑警示斜紋、粗黑體、硬切閃兩下，四周紅色暈邊（使用者：要真的有警語的感覺，會嚇一跳） */
#nag { position: absolute; left: 0; right: 0; bottom: 17%; padding: .72em 0 .68em; text-align: center; background: rgba(222, 0, 0, .94); color: #fff;
       font: 900 26px/1.15 "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; letter-spacing: .14em; white-space: nowrap;
       text-shadow: 0 2px 0 rgba(0,0,0,.45); opacity: 0; pointer-events: none; }
#nag::before, #nag::after { content: ''; position: absolute; left: 0; right: 0; height: .34em; background: repeating-linear-gradient(-45deg, #ffd000 0 .55em, #111 .55em 1.1em); }
#nag::before { top: 0; } #nag::after { bottom: 0; }
#nag b { color: #ffd000; font-weight: 900; margin: 0 .5em; }
#nag.show { animation: nagFlash 1.6s step-end forwards; }
@keyframes nagFlash { 0% { opacity: 1; } 28% { opacity: 0; } 44% { opacity: 1; } 72% { opacity: 0; } 100% { opacity: 0; } }
#drop { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(242,154,46,.25); border: 3px dashed var(--accent); font-size: 20px; text-align: center; }
.bar { grid-area: bar; display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 8px 16px 0; }
.grp { display: flex; align-items: center; gap: 6px; }
.grp.grow { flex: 1 1 260px; min-width: 200px; }
.grp label, .pset label { color: var(--muted); }
.vsep { width: 1px; height: 22px; background: var(--line); }
.chips { display: flex; gap: 6px; }
.chip { font-size: 12px; color: var(--muted); background: #121517; border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; cursor: default; }
.chip b { margin-left: 4px; font-weight: 700; }
.chip b.ok { color: #9fd49a; } .chip b.warn { color: #ffb36b; }
input[type=range] { flex: 1; min-width: 60px; accent-color: var(--accent); }
input[type=number], select { background: #121517; color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px; }
input[type=number] { width: 64px; }
input[type=color] { width: 28px; height: 22px; padding: 0; border: 1px solid var(--line); background: none; }
button { background: #2c3236; color: var(--fg); border: 1px solid #454d52; border-radius: 3px; padding: 4px 10px; cursor: pointer; font: inherit; }
button.primary { background: var(--accent); border-color: var(--accent); color: #1a1a1a; font-weight: 700; }
button:disabled { opacity: .45; cursor: default; }
.val { font-variant-numeric: tabular-nums; min-width: 56px; }
.status { color: var(--muted); font-size: 12px; line-height: 1.4; }
.pset { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pset[hidden] { display: none; }
.faces { display: flex; align-items: center; gap: 4px 9px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.fpart { color: var(--fg); font-weight: 700; }
.face { display: inline-flex; align-items: center; gap: 3px; }
.face input[type=checkbox] { margin: 0; }
.pp { display: inline-flex; align-items: center; gap: 3px; color: var(--muted); font-size: 12px; }
.pp[hidden] { display: none; }
.pp input[type=number], .pset input.n { width: 54px; }
.vb { display: inline-flex; align-items: center; gap: 3px; }
.vary-off .vb { display: none; }
.warn { color: #ffb36b; } .ok { color: #9fd49a; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; padding: 4px 11px; }
.seg button:first-child { border-radius: 3px 0 0 3px; margin-left: 0; } .seg button:last-child { border-radius: 0 3px 3px 0; }
.seg button.on { background: #4a5a66; border-color: #6d8494; color: #fff; }
.board { grid-area: board; min-width: 0; height: clamp(290px, 44vh, 420px); display: flex; flex-direction: column; margin: 8px 16px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.tabs { display: flex; gap: 2px; padding: 6px 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: flex-end; }
.tabs #bSize { margin-left: auto; padding: 0 2px 5px; }
.tabs button { border-radius: 4px 4px 0 0; border-bottom: none; background: #24292c; }
.tabs button.on { background: var(--accent); color: #1a1a1a; font-weight: 700; border-color: var(--accent); }
.toolbar { display: flex; gap: 5px 8px; padding: 6px 10px; flex-wrap: wrap; align-items: center; }
.toolbar .sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
.stage { flex: 1 1 auto; min-height: 60px; box-sizing: border-box; overflow: auto; padding: 8px 10px; background: repeating-conic-gradient(#2a2f32 0% 25%, #24282b 0% 50%) 50% / 16px 16px; position: relative; }
#boardCv { display: block; cursor: default; touch-action: none; }
.foot { display: flex; align-items: center; gap: 12px; padding: 4px 12px 6px; }
.hint { flex: 1; min-width: 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1250px) { header .sub { display: none; } }
body.full { display: block; } body.full header, body.full .bar, body.full .board { display: none; }
body.full .panes { display: block; padding: 0; container-type: normal; } body.full #simPane { width: 100vw; height: 56.25vw; aspect-ratio: auto; border-radius: 0; }
</style>
<script src="data.js"></script>

<body>
<header>
  <h1>套皮即時預覽</h1>
  <span class="sub">示意道路：進出隧道、新設鋼構橋、兩側欒樹三種路段反覆出現（不是現地線形，只看設計效果）｜請用 Chrome 或 Edge</span>
</header>
<div class="panes">
  <div class="pane" id="simPane">
    <div class="tag" id="viewTag">模擬（示意道路）</div>
    <div class="viewhint" id="viewHint"></div>
    <div class="hud" id="hud">—</div>
    <div class="note" id="fps"></div>
    <div id="nag"><b>⚠</b>專心駕駛！不要東張西望！<b>⚠</b></div>
    <div id="drop">放開以載入<br><small>隔音牆.png、施工圍籬.png、方案設定.xlsx</small></div>
  </div>
</div>

<div class="bar">
  <div class="grp"><button class="primary" id="play" title="空白鍵">▶ 播放</button><input type="range" id="speed" min="40" max="110" step="1" value="100" style="flex:none;width:80px" title="車速（↑↓ 也可調整）"><span class="val" id="speedV">100 km/h</span></div>
  <div class="grp grow"><label>位置</label><canvas id="route" title="點一下或拖曳跳到該處"></canvas><span class="val" id="posV"></span></div>
  <div class="grp">
    <select id="cam" title="視角"><option value="drive">駕駛視角</option><option value="orbit">自由視角</option><option value="elev">立面檢視</option></select>
    <select id="view" title="駕駛視角的方向（← → 可暫時轉頭）"><option value="0">正前方</option><option value="30">右前方</option><option value="-30">左前方</option><option value="up">仰看高架</option></select>
    <select id="side" title="立面檢視看哪一側" hidden><option value="1">右側（南下側）</option><option value="-1">左側（北上側）</option></select>
    <select id="light" title="光線"><option value="day">白天</option><option value="dusk">傍晚</option></select>
    <label title="動態模糊（快門 1/60 秒）"><input type="checkbox" id="blur" checked> 模糊</label>
    <label title="明暗適應：進隧道先暗後慢慢適應、出隧道瞬間過曝再恢復（駕駛視角）"><input type="checkbox" id="adapt" checked> 明暗</label>
    <label title="其他車輛（同向會超車、對向來車）"><input type="checkbox" id="traffic" checked> 車流</label>
    <button id="shot" title="把目前的模擬畫面存成 PNG">截圖</button>
  </div>
  <span class="vsep"></span>
  <div class="grp"><button class="primary" id="pickDir" title="資料夾裡的 隔音牆.png（或 南下_車道側.png）、施工圍籬.png、方案設定.xlsx 會自動對應；Illustrator 重新匯出或 Excel 存檔後自動更新">方案資料夾</button><button id="pickFiles" title="選擇個別檔案">檔案</button>
    <span class="chips"><span class="chip">隔音牆<b id="s_wall">—</b></span><span class="chip">圍籬<b id="s_fence">—</b></span><span class="chip">設定<b id="s_xlsx">—</b></span></span>
    <span class="status" id="watchStatus"></span></div>
</div>

<section class="board">
  <div class="tabs" id="tabs">
    <button data-tab="fence">施工圍籬</button><button data-tab="wall">隔音牆</button><button data-tab="bridge">鋼構橋</button>
    <span class="status" id="bSize"></span>
  </div>
  <div class="toolbar">
    <div class="pset" data-for="fence"><label>單元寬度</label><input type="number" id="fenceW" min="2" step="2" value="20"> m</div>
    <div class="pset" data-for="wall">
      <label>一組</label><input type="number" id="wallN" min="1" max="200" step="1" value="30" title="畫布寬度＝幾片板（每片 2 m），沿線重複"> 片 <span class="status" id="wallWv"></span>
      <select id="mode" title="上色方式"><option value="板塊">每片板單色</option><option value="自由">圖案跨板</option></select>
      <span class="sep"></span>
      <label>牆高</label><select id="wallRows"></select>
      <label>透明板</label><select id="wallGlass" title="由上往下數，幾排做成透明板"></select>
      <label>兩端階梯</label><select id="wallStep" title="牆的起訖兩端逐片降低一排（簡章：起訖點要有漸變造型）"><option value="0">無</option><option value="1">1 階</option><option value="2">2 階</option><option value="3">3 階</option><option value="4">4 階</option><option value="6">6 階</option></select>
      <label>紋理</label><select id="wallTex"><option value="0">素面</option><option value="1" title="吸音金屬板">水平紋</option><option value="2">直條格柵</option></select>
    </div>
    <div class="pset" data-for="bridge">
      <span class="seg" id="bType"><button data-v="none">不分色</button><button data-v="slope">斜線</button><button data-v="curve">曲線</button><button data-v="band">色帶</button></span>
      <span class="sep"></span>
      <span class="seg" id="bMode"><button data-v="fixed">每座一樣</button><button data-v="ramp">漸變</button><button data-v="curve">依彎道</button></span>
      <span class="sep"></span>
      <label>橋墩</label><input type="color" id="cPier"><label>色塊</label><input type="color" id="cAcc" value="#a8d08d"><label>箱梁</label><input type="color" id="cGird">
      <span class="sep"></span>
      <select id="bView" title="右邊縮圖顯示哪一座"></select>
      <button id="bAdv" title="各面分色、沿線色帶">進階…</button>
    </div>
    <div class="pset" data-for="band"><button id="bBack">← 返回</button><div class="faces" id="faces"></div><label class="status"><input type="checkbox" id="pAccBand"> 色塊也用沿線色帶</label><span class="status" id="bridgeInfo"></span></div>
    <span class="sep"></span>
    <div class="pset" data-for="fence wall band">
      <span id="layerOps"><button id="bFill">填滿</button><button id="bUp">上移一層</button><button id="bDown">下移一層</button><button id="bDup">複製</button><button id="bDel">刪除</button><span class="sep"></span></span>
      <label class="status">底色 <input type="color" id="bBg" value="#ffffff"></label>
      <label class="status"><input type="checkbox" id="bGuides" checked> 格線</label>
      <label class="status">縮放 <input type="range" id="bZoom" min="0" max="100" value="0" style="flex:none;width:80px"></label>
    </div>
  </div>
  <div class="stage" id="stage"><canvas id="boardCv"></canvas></div>
  <div class="foot">
    <div class="hint" id="bHint"></div>
    <div class="brand"><span>© 2026 VISION BASE<br>版權所有</span><img src="logo_visionbase.png" alt="VISION BASE"></div>
  </div>
</section>
<input type="file" id="fileIn" accept=".png,.xlsx" multiple hidden>

<script type="module">
import * as THREE from 'three';
const D = window.PREVIEW;
const $ = id => document.getElementById(id);
const QS = new URLSearchParams(location.search);
if (QS.has('full')) document.body.classList.add('full');
const SHUTTER = 1 / 60;                                   // same exposure as the UE renders (60 fps, 360° shutter)
const PXM = 50;                                           // canvas px per metre (= the Illustrator templates)
const WL = Object.assign({}, D.wall);                     // rows / row_h / bay_m; rows can be changed on the page (牆高)
let RW = WL.rows * WL.row_h;

// ================= 3D scene =================
const pane = $('simPane');
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
pane.prepend(renderer.domElement);
const scene = new THREE.Scene();
const SKY = new THREE.Color(0xc9d4dc); scene.background = SKY;
const FOG = [350, 3200]; scene.fog = new THREE.Fog(SKY, FOG[0], FOG[1]);
const SUN = new THREE.Vector3(-0.45, 0.78, -0.43).normalize();
const hemi = new THREE.HemisphereLight(0xe6edf2, 0x5d6150, 1.15); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3e2, 1.9); sun.position.copy(SUN); scene.add(sun);
const camera = new THREE.PerspectiveCamera(D.cam.vfov, 16 / 9, 0.1, 7000);
const camPrev = camera.clone();
const UP = new THREE.Vector3(0, 1, 0);
const KEY = new THREE.Color(0.55, 0.55, 0.55), AMB = new THREE.Color(0.62, 0.62, 0.62);   // shade() light: key (sun) + ambient
const LIGHT = `
  uniform vec3 uSun, uFogColor, uKey, uAmb; uniform float uFogNear, uFogFar;
  vec3 shade(vec3 albedo, vec3 n, float depth) {
    vec3 c = albedo * (uAmb + uKey * max(dot(n, uSun), 0.0));
    return mix(c, uFogColor, smoothstep(uFogNear, uFogFar, depth));
  }`;
const common = () => ({ uSun: { value: SUN }, uFogColor: { value: SKY }, uFogNear: { value: FOG[0] }, uFogFar: { value: FOG[1] }, uKey: { value: KEY }, uAmb: { value: AMB } });

// bridge parts: one colour per face like the UE colour tables (0 北 1 南 2 東 3 西 4 頂 5 底). The face id is stored per vertex from the
// part's own frame, named for the nominal layout (南下 heads south, the 南下 viaduct is on the west), so curves never swap faces.
// A face can take its colour from the route colour band instead (aT = route position of the pier / girder point).
// Piers can also get a two-colour split (斜率／曲度／線段) on the column: aX = across the column (0 road side .. 1 outer side),
// aZ = metres above the ground, aShp = this pier's parameters (computed on the page from the 橋墩造型 settings).
const BAND_TEX = new THREE.CanvasTexture(document.createElement('canvas')); BAND_TEX.colorSpace = THREE.SRGBColorSpace;
function faceMat(shape) {
  const u = Object.assign(common(), { cF: { value: [0, 1, 2, 3, 4, 5].map(() => new THREE.Color(0x8f969c)) }, uBand: { value: [0, 0, 0, 0, 0, 0] }, tBand: { value: BAND_TEX },
                                      uShape: { value: 0 }, cAcc: { value: new THREE.Color(0xa8d08d) }, uAccBand: { value: 0 }, uLowOuter: { value: 0 } });
  const SV = shape ? 'attribute float aX; attribute float aZ; attribute float aCol; attribute vec4 aShp; varying float vX; varying float vZ; varying float vCol; varying vec4 vS;' : '';
  return new THREE.ShaderMaterial({ uniforms: u, side: THREE.DoubleSide,
    vertexShader: SV + `attribute float aT; attribute float aF; varying float vT; varying float vF; varying vec3 vN; varying float vDepth;
      void main() { vT = aT; vF = aF; ` + (shape ? 'vX = aX; vZ = aZ; vCol = aCol; vS = aShp; ' : '') + `vN = normal;
        vec4 mv = modelViewMatrix * vec4(position, 1.0); vDepth = -mv.z; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: LIGHT + (shape ? 'varying float vX; varying float vZ; varying float vCol; varying vec4 vS;' : '') + `
      uniform vec3 cF[6]; uniform float uBand[6]; uniform sampler2D tBand; uniform float uShape, uAccBand, uLowOuter; uniform vec3 cAcc;
      varying float vT; varying float vF; varying vec3 vN; varying float vDepth;
      vec3 bandC() { return textureLod(tBand, vec2(clamp(vT, 0.001, 0.999), 0.5), 0.0).rgb; }
      void main() {
        vec3 n = normalize(vN); if (!gl_FrontFacing) n = -n;
        int f = int(vF + 0.5); vec3 c = cF[f];
        if (uBand[f] > 0.5) c = bandC();` + (shape ? `
        if (uShape > 0.5 && vCol > 0.5) {
          bool acc = false;
          if (uShape < 1.5) { float x = clamp(uLowOuter > 0.5 ? 1.0 - vX : vX, 0.0, 1.0); acc = vZ < vS.x + (vS.y - vS.x) * pow(x, vS.z); }
          else { for (int k = 0; k < 12; k++) { if (float(k) > vS.z - 0.5) break; if (abs(vZ - vS.x - float(k) * vS.w) < 0.5 * vS.y) acc = true; } }
          if (acc) c = uAccBand > 0.5 ? bandC() : cAcc;
        }` : '') + `
        gl_FragColor = vec4(shade(c, n, vDepth), 1.0);
      }` });
}
const pierMat = faceMat(true), girderMat = faceMat(false);
const lam = hex => new THREE.MeshLambertMaterial({ color: hex, side: THREE.DoubleSide });
const MATS = { road: lam(0x55585a), white: lam(0xe9e9e3), yellow: lam(0xe2b43c), concrete: lam(0xbdbeb8), asphalt: lam(0x4b4d4f),
               roadIn: lam(0x141516), whiteIn: lam(0x434341), yellowIn: lam(0x403515),        // inside the tunnels (much less light; the eye adapts)
               girder: girderMat, pier: pierMat, overpass: lam(0xb7b8b2), abutment: lam(0xb4b4ac) };
const offs = (m, f, u) => { m.polygonOffset = true; m.polygonOffsetFactor = f; m.polygonOffsetUnits = u; };
offs(MATS.road, -1, -2); offs(MATS.roadIn, -1, -2); for (const k of ['white', 'yellow', 'whiteIn', 'yellowIn']) offs(MATS[k], -3, -6);

// ================= 示意道路 v5 (procedural; 2026-10-27: 三種情境反覆 進出隧道／新設鋼構橋／兩側欒樹＋直路、彎路) =================
// coordinates: m = 里程 along the road (0 = start of the drive), y = offset from the median (+ = right of the 南下 driver), h = height
// 2026-10-27 使用者：「路段太多，不知道要看什麼」→ no empty straights / curves any more: the three scenarios follow each other with
// 100 m transitions; round ① on the straight, round ② in curves (straight / curve is a property of each scenario now)
